<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Production DBMS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="win-login" class="window">
        <div class="login-card">
            <h2>Film Production Giriş</h2>
            <input type="text" id="username" placeholder="Email">
            <input type="password" id="password" placeholder="Şifre">
            <button onclick="app.login()">Giriş Yap</button>
        </div>
    </div>

    <div id="win-main" class="window" style="display:none;">
        <div class="nav-bar">
            <h2>Dashboard</h2>
            <div id="admin-tools" style="display:none;">
                <button onclick="app.showAddForm()" class="btn-add">Add Movie</button>
                <button onclick="app.setAdminMode('update')" class="btn-upd">Update Mode</button>
                <button onclick="app.setAdminMode('delete')" class="btn-del">Delete Mode</button>
                <button onclick="app.showArchive()" class="btn-archive">Archive</button>
            </div>
            <button onclick="location.reload()" class="btn-logout">Logout</button>
        </div>
        <div id="search-section" style="margin: 20px auto; width: 90%;">
            <input type="text" id="search-input" placeholder="Film ara..." oninput="app.search()" style="width: 100%; padding: 10px;">
        </div>
        <div id="movie-grid" class="movie-grid"></div>
    </div>

    <div id="win-form" class="window" style="display:none;">
        <div class="form-container">
            <button onclick="app.showWindow('win-main')" class="btn-back">← Geri</button>
            <div class="form-body">
                <img id="f-preview" src="https://via.placeholder.com/150" style="width:140px; height:200px; object-fit:cover; border-radius:8px;">
                <h3 id="form-title">Film Yönetimi</h3>
                <input type="hidden" id="f-id"> 
                
                <div class="input-fields">
                    <label>Film Title:</label> <input type="text" id="f-title">
                    <label>Director:</label> <input type="text" id="f-director">
                    <label>Budget ($):</label> <input type="number" id="f-budget">
                    <label>Release Year:</label> <input type="number" id="f-date">
                    <label>Poster URL:</label> <input type="text" id="f-poster" oninput="document.getElementById('f-preview').src = this.value">
                </div>

                <div id="relation-sections" style="width: 100%; margin-top: 20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h4>🎭 Cast</h4>
                        <button type="button" onclick="app.addCastRow()" style="background:#27ae60; padding:5px;">+ Add</button>
                    </div>
                    <div id="cast-inputs-container"></div>
                    
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
                        <h4>📍 Scene & Locations</h4>
                        <button type="button" onclick="app.addLocationRow()" style="background:#27ae60; padding:5px;">+ Add</button>
                    </div>
                    <div id="location-inputs-container"></div>

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px;">
                        <h4>💰 Expenses</h4>
                        <button type="button" onclick="app.addExpenseRow()" style="background:#27ae60; padding:5px;">+ Add</button>
                    </div>
                    <div id="expense-inputs-container"></div>
                </div>

                <button id="submit-btn" onclick="app.handleDataOperation()" style="width:100%; margin-top:20px;">KAYDET</button>
            </div>  
        </div>
    </div>

    <div id="win-archive" class="window" style="display:none;">
        <div class="archive-container">
            <button onclick="app.showWindow('win-main')">← Geri</button>
            <h2>Silinen Harcama Arşivi</h2>
            <div class="table-wrapper">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: #2c3e50; color: white;">
                            <th style="padding:10px;">Film Adı</th>
                            <th style="padding:10px;">Maliyet ($)</th>
                            <th style="padding:10px;">Silinme Tarihi</th>
                        </tr>
                    </thead>
                    <tbody id="archive-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
